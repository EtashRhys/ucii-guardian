[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ucii-guardian"
version = "0.1.0"
description = "Bounded autonomous authority agent built with AWS Strands Agents and UCII"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.0.0",
  "ucii-sdk @ git+https://github.com/EtashRhys/UCII.git@d0c903fb040e41b6a7f10dccd2d840311f06d1eb#subdirectory=sdk",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
