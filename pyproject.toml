[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ucii-guardian"
version = "0.1.0"
description = "Bounded autonomous authority agent built with AWS Strands Agents and UCII"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.0.0",
  "liboqs-python==0.16.0",
  "starlette>=1.0.0",
  "uvicorn>=0.52.0",
  "ucii-sdk @ git+https://github.com/EtashRhys/UCII.git@9989ca2d53a86bf8f158a3c89c04fef88e18cc6b#subdirectory=sdk",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
